  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 d=\"M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z\"></path><path d=\"M2 21c0-3 1.85-5.36 5.08-6\"></path></svg>\n          <span style=\"font-weight:700;font-size:19px;letter-spacing:-0.3px;color:#111827;\">AgriScheme<span style=\"color:#1a6b3c;\"> Marketplace</span></span>\n        </div>\n        <div style=\"flex:1;max-width:440px;position:relative;\">\n          <svg style=\"position:absolute;left:14px;top:11px;\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#9ca3af\" stroke-width=\"2.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"></circle><path d=\"m21 21-4.3-4.3\"></path></svg>\n          <input value=\"{{ query }}\" sc-camel-on-change=\"{{ onQuery }}\" placeholder=\"Search crops, farms, harvest boxes…\" style=\"width:100%;height:42px;border:1px solid #e5e7eb;border-radius:10px;padding:0 14px 0 40px;font-size:14px;background:#f9fafb;outline:none;\" style-focus=\"border-color:#1a6b3c;background:#fff;box-shadow:0 0 0 3px rgba(26,107,60,.12);\">\n        </div>\n        <div style=\"flex:1;\"></div>\n        <div style=\"display:flex;align-items:center;gap:10px;flex:none;\">\n          <div style=\"display:flex;background:#f3f4f6;border-radius:10px;padding:3px;\">\n            <button sc-camel-on-click=\"{{ setBuyerMode }}\" style=\"{{ buyTabStyle }}\">Shop</button>\n            <button sc-camel-on-click=\"{{ setSellerMode }}\" style=\"{{ sellTabStyle }}\">Sell</button>\n          </div>\n          <button sc-camel-on-click=\"{{ goCart }}\" style=\"position:relative;height:42px;padding:0 15px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;font-weight:600;font-size:13.5px;color:#374151;cursor:pointer;display:flex;align-items:center;gap:8px;\" style-hover=\"border-color:#1a6b3c;color:#1a6b3c;\">\n            <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"8\" cy=\"21\" r=\"1\"></circle><circle cx=\"19\" cy=\"21\" r=\"1\"></circle><path d=\"M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12\"></path></svg>\n            Cart\n            <span style=\"min-width:20px;height:20px;border-radius:999px;background:#1a6b3c;color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;\">{{ cartCount }}</span>\n          </button>\n          <button sc-camel-on-click=\"{{ goOnboard }}\" style=\"height:42px;padding:0 18px;border:none;border-radius:10px;background:#1a6b3c;color:#fff;font-weight:600;font-size:13.5px;cursor:pointer;\" style-hover=\"background:#0f4a28;\">Sign up</button>\n        </div>\n      </div>\n    </header>\n  </sc-if>\n\n  <!-- ============ ONBOARDING ============ -->\n  <sc-if value=\"{{ isOnboard }}\" hint-placeholder-val=\"{{ false }}\">\n    <main data-screen-label=\"Onboarding\" style=\"flex:1;background:linear-gradient(135deg,#0f4a28,#1a6b3c 55%,#2d9e5f);display:flex;align-items:center;justify-content:center;padding:48px 24px;\">\n      <div style=\"width:520px;max-width:100%;\">\n        <div style=\"text-align:center;margin-bottom:24px;\">\n          <div style=\"display:inline-flex;align-items:center;gap:8px;color:#fff;margin-bottom:6px;\">\n            <svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#e8b84b\" stroke-width=\"2.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z\"></path><path d=\"M2 21c0-3 1.85-5.36 5.08-6\"></path></svg>\n            <span style=\"font-size:26px;font-weight:700;\">AgriScheme<span style=\"color:#e8b84b;\"> Marketplace</span></span>\n          </div>\n          <p style=\"color:#bbf7d0;font-size:14px;margin:0;\">Fresh from Malaysian farms — buy direct, or sell your harvest.</p>\n        </div>\n        <div style=\"background:#fff;border-radius:16px;box-shadow:0 20px 40px rgba(0,0,0,.18);overflow:hidden;\">\n          <div style=\"padding:28px;\">\n            <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:22px;\">\n              <div sc-camel-on-click=\"{{ pickRoleHousehold }}\" style=\"{{ roleCardHousehold }}\">\n                <div style=\"font-weight:700;font-size:13.5px;color:#111827;\">Household</div>\n                <div style=\"font-size:11.5px;color:#9ca3af;margin-top:3px;\">For my kitchen</div>\n              </div>\n              <div sc-camel-on-click=\"{{ pickRoleBusiness }}\" style=\"{{ roleCardBusiness }}\">\n                <div style=\"font-weight:700;font-size:13.5px;color:#111827;\">Business</div>\n                <div style=\"font-size:11.5px;color:#9ca3af;margin-top:3px;\">Wholesale buyer</div>\n              </div>\n              <div sc-camel-on-click=\"{{ pickRoleFarmer }}\" style=\"{{ roleCardFarmer }}\">\n                <div style=\"font-weight:700;font-size:13.5px;color:#111827;\">Farmer</div>\n                <div style=\"font-size:11.5px;color:#9ca3af;margin-top:3px;\">Sell my crops</div>\n              </div>\n            </div>\n            <div style=\"display:flex;flex-direction:column;gap:12px;\">\n              <div>\n                <label style=\"font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:5px;\">{{ onboardNameLabel }}</label>\n                <input placeholder=\"{{ onboardNamePlaceholder }}\" style=\"width:100%;height:44px;border:1px solid #e5e7eb;border-radius:10px;padding:0 14px;font-size:14px;outline:none;\" style-focus=\"border-color:#1a6b3c;box-shadow:0 0 0 3px rgba(26,107,60,.12);\">\n              </div>\n              <div>\n                <label style=\"font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:5px;\">Email</label>\n                <input placeholder=\"you@example.com\" style=\"width:100%;height:44px;border:1px solid #e5e7eb;border-radius:10px;padding:0 14px;font-size:14px;outline:none;\" style-focus=\"border-color:#1a6b3c;box-shadow:0 0 0 3px rgba(26,107,60,.12);\">\n              </div>\n              <div>\n                <label style=\"font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:5px;\">Location (state / poskod)</label>\n                <input placeholder=\"e.g. Cameron Highlands, 39000\" style=\"width:100%;height:44px;border:1px solid #e5e7eb;border-radius:10px;padding:0 14px;font-size:14px;outline:none;\" style-focus=\"border-color:#1a6b3c;box-shadow:0 0 0 3px rgba(26,107,60,.12);\">\n              </div>\n              <button sc-camel-on-click=\"{{ finishOnboard }}\" style=\"height:46px;border:none;border-radius:10px;background:#1a6b3c;color:#fff;font-weight:600;font-size:15px;cursor:pointer;margin-top:4px;\" style-hover=\"background:#0f4a28;\">{{ onboardCta }}</button>\n            </div>\n          </div>\n        </div>\n        <p style=\"text-align:center;color:#bbf7d0;font-size:12.5px;margin-top:16px;\">Free to join · list produce with no upfront cost</p>\n      </div>\n    </main>\n  </sc-if>\n\n  <!-- ============ BROWSE ============ -->\n  <sc-if value=\"{{ isBrowse }}\" hint-placeholder-val=\"{{ true }}\">\n    <main data-screen-label=\"Browse\" style=\"flex:1;\">\n      <sc-if value=\"{{ showBanner }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"background:#dcfce7;border-bottom:1px solid #bbf7d0;\">\n          <div style=\"max-width:1200px;margin:0 auto;padding:9px 24px;font-size:13px;font-weight:600;color:#15803d;display:flex;align-items:center;gap:8px;\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15803d\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z\"></path><path d=\"M2 21c0-3 1.85-5.36 5.08-6\"></path></svg>\n            Musim menuai — free local delivery on orders over RM100 this week\n          </div>\n        </div>\n      </sc-if>\n      <div style=\"max-width:1200px;margin:0 auto;padding:32px 24px;\">\n        <div style=\"margin-bottom:22px;\">\n          <h1 style=\"font-size:30px;font-weight:700;letter-spacing:-0.6px;margin:0;color:#111827;\">Fresh from the ladang</h1>\n          <p style=\"margin:6px 0 0;color:#6b7280;font-size:14.5px;\">{{ resultLine }}</p>\n        </div>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;\">\n          <sc-for list=\"{{ catChips }}\" as=\"chip\" hint-placeholder-count=\"6\">\n            <button sc-camel-on-click=\"{{ chip.pick }}\" style=\"{{ chip.style }}\">{{ chip.label }}</button>\n          </sc-for>\n        </div>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px;\">\n          <sc-for list=\"{{ typeChips }}\" as=\"chip\" hint-placeholder-count=\"5\">\n            <button sc-camel-on-click=\"{{ chip.pick }}\" style=\"{{ chip.style }}\">{{ chip.label }}</button>\n          </sc-for>\n        </div>\n\n        <sc-if value=\"{{ isGridLayout }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:20px;\">\n            <sc-for list=\"{{ shownProducts }}\" as=\"p\" hint-placeholder-count=\"8\">\n              <div sc-camel-on-click=\"{{ p.open }}\" style=\"background:#fff;border:1px solid #f3f4f6;border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.04);overflow:hidden;cursor:pointer;transition:box-shadow .15s, transform .15s, border-color .15s;\" style-hover=\"box-shadow:0 10px 24px rgba(0,0,0,.08);transform:translateY(-2px);border-color:#e5e7eb;\">\n                <div class=\"{{ p.imgClass }}\" style=\"{{ p.imgStyle }}\">\n                  <span style=\"{{ p.labelPill }}\">{{ p.imgLabel }}</span>\n                </div>\n                <div style=\"padding:15px 16px 17px;\">\n                  <span sty yle=\"color:#1a6b3c;\">{{ total }}</span></div>\n            <button sc-camel-on-click=\"{{ placeOrder }}\" style=\"width:100%;height:46px;border:none;border-radius:10px;background:#1a6b3c;color:#fff;font-weight:600;font-size:15px;cursor:pointer;\" style-hover=\"background:#0f4a28;\">Place order</button>\n          </div>\n        </div>\n      </div>\n    </main>\n  </sc-if>\n\n  <!-- ============ ORDER CONFIRMED ============ -->\n  <sc-if value=\"{{ isConfirm }}\" hint-placeholder-val=\"{{ false }}\">\n    <main data-screen-label=\"Order confirmed\" style=\"flex:1;display:flex;align-items:center;justify-content:center;padding:56px 24px;\">\n      <div style=\"text-align:center;max-width:440px;\">\n        <div style=\"width:72px;height:72px;border-radius:999px;background:#dcfce7;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;\">\n          <svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15803d\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"></path></svg>\n        </div>\n        <h1 style=\"font-size:26px;font-weight:700;letter-spacing:-0.4px;margin:0 0 10px;color:#111827;\">Order placed!</h1>\n        <p style=\"color:#6b7280;font-size:15px;line-height:1.6;margin:0 0 24px;\">Order <strong style=\"color:#111827;\">#AS-2481</strong> is on its way to the farms. You'll get a WhatsApp when each farm confirms.</p>\n        <button sc-camel-on-click=\"{{ goBrowse }}\" style=\"height:46px;padding:0 24px;border:none;border-radius:10px;background:#1a6b3c;color:#fff;font-weight:600;font-size:15px;cursor:pointer;\">Keep shopping</button>\n      </div>\n    </main>\n  </sc-if>\n\n  <!-- ============ SELLER PORTAL (dark sidebar) ============ -->\n  <sc-if value=\"{{ isSeller }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Seller portal\" style=\"display:flex;height:100vh;overflow:hidden;background:#f9fafb;\">\n      <aside style=\"wi v>\n                      </div>\n                      <span style=\"{{ l.badgeStyle }}\">{{ l.badge }}</span>\n                      <span style=\"{{ l.stockStyle }}\">{{ l.stockLabel }}</span>\n                      <div style=\"font-size:12.5px;color:#9ca3af;min-width:78px;text-align:right;\">{{ l.views }} views</div>\n                    </div>\n                  </sc-for>\n                </div>\n              </div>\n            </sc-if>\n\n            <!-- New listing -->\n            <sc-if value=\"{{ isSellerNew }}\" hint-placeholder-val=\"{{ false }}\">\n              <div data-screen-label=\"New listing\" style=\"max-width:560px;\">\n                <h2 style=\"font-size:21px;font-weight:700;color:#111827;margin:0 0 3px;\">New listing</h2>\n                <p style=\"font-size:13.5px;color:#9ca3af;margin:0 0 18px;\">List a crop, harvest box, or wholesale lot.</p>\n                <div style=\"background:#fff;border:1px solid #f3f4f6;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.04);padding:22px;display:flex;flex-direction:column;gap:14px;\">\n                  <div>\n                    <label style=\"font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:5px;\">Product name</label>\n                    <input value=\"{{ formName }}\" sc-camel-on-change=\"{{ onFormName }}\" placeholder=\"e.g. Sawi Hijau (Green Mustard)\" style=\"width:100%;height:44px;border:1px solid #e5e7eb;border-radius:10px;padding:0 13px;font-size:14px;outline:none;\" style-focus=\"border-color:#1a6b3c;box-shadow:0 0 0 3px rgba(26,107,60,.12);\">\n                  </div>\n                  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;\">\n                    <div>\n                      <label style=\"font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:5px;\">Category</label>\n                      <sc-raw-select value=\"{{ formCat }}\" sc-camel-on-change=\"{{ onFormCat }}\" style=\"width:100%;height:44px;border:1px solid #e5e7eb;border-radius:10px;padding:0 10px;font-size:14px;background:#fff;outline:none;\">\n                        <option>Vegetables</option><option>Fruit</option><option>Rice &amp; Grains</option><option>Dairy &amp; Eggs</option><option>Pantry</option><option>Boxes &amp; Shares</option>\n                      </sc-raw-select>\n                    </div>\n                    <div>\n                      <label style=\"font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:5px;\">Listing type</label>\n                      <sc-raw-select value=\"{{ formType }}\" sc-camel-on-change=\"{{ onFormType }}\" style=\"width:100%;height:44px;border:1px solid #e5e7eb;border-radius:10px;padding:0 10px;font-size:14px;background:#fff;outline:none;\">\n                        <option value=\"now\">Buy now</option><option value=\"preorder\">Pre-order</option><option value=\"sub\">Subscription</option><option value=\"bulk\">Wholesale</option>\n                      </sc-raw-select>\n                    </div>\n                  </div>\n                  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;\">\n                    <div>\n                      <label style=\"font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:5px;\">Price (RM)</label>\n                      <input value=\"{{ formPrice }}\" sc-camel-on-change=\"{{ onFormPrice }}\" placeholder=\"e.g. 4.50\" style=\"width:100%;height:44px;border:1px solid #e5e7eb;border-radius:10px;padding:0 13px;font-size:14px;outline:none;\" style-focus=\"border-color:#1a6b3c;box-shadow:0 0 0 3px rgba(26,107,60,.12);\">\n                    </div>\n                    <div>\n                      <label style=\"font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:5px;\">Unit</label>\n                      <input value=\"{{ formUnit }}\" sc-camel-on-change=\"{{ onFormUnit }}\" placeholder=\"e.g. per kg\" style=\"width:100%;height:44px;border:1px solid #e5e7eb;border-radius:10px;padding:0 13px;font-size:14px;outline:none;\" style-focus=\"border-color:#1a6b3c;box-shadow:0 0 0 3px rgba(26,107,60,.12);\">\n                    </div>\n                  </div>\n                  <div style=\"height:108px;border:1.5px dashed #d1d5db;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#9ca3af;background:#f9fafb;cursor:pointer;\">\n                    <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#9ca3af\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"18\" height=\"18\" x=\"3\" y=\"3\" rx=\"2\" ry=\"2\"></rect><circle cx=\"9\" cy=\"9\" r=\"2\"></circle><path d=\"m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21\"></path></svg>\n                    <span style=\"font-size:12.5px;\">Drop product photos here</span>\n                  </div>\n                  <button sc-camel-on-click=\"{{ publishListing }}\" style=\"height:46px;border:none;border-radius:10px;background:#1a6b3c;color:#fff;font-weight:600;font-size:15px;cursor:pointer;\" style-hover=\"background:#0f4a28;\">Publish listing</button>\n                  <sc-if value=\"{{ formError }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex;align-items:center;gap:7px;color:#b91c1c;background:#fee2e2;border-radius:9px;padding:9px 12px;font-weight:600;font-size:13px;\">Please fill in a name and price.</div>\n                  </sc-if>\n                </div>\n              </div>\n            </sc-if>\n\n            <!-- Orders -->\n            <sc-if value=\"{{ isSellerOrders }}\" hint-placeholder-val=\"{{ false }}\">\n              <div data-screen-label=\"Seller orders\">\n                <h2 style=\"font-size:21px;font-weight:700;color:#111827;margin:0 0 3px;\">Orders</h2>\n                <p style=\"font-size:13.5px;color:#9ca3af;margin:0 0 18px;\">Incoming orders and quote requests</p>\n                <div style=\"background:#fff;border:1px solid #f3f4f6;border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.04);overflow:hidden;\">\n                  <div style=\"display:grid;grid-template-columns:1.4fr 1.4fr 1fr 0.7fr;gap:12px;padding:12px 18px;background:#f9fafb;border-bottom:1px solid #f3f4f6;\">\n                    <span style=\"font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;\">Order</span>\n                    <span style=\"font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;\">Items</span>\n                    <span style=\"font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;\">Status</span>\n                    <span style=\"font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;text-align:right;\">Total</span>\n                  </div>\n                  <sc-for list=\"{{ sellerOrders }}\" as=\"o\" hint-placeholder-count=\"4\">\n                    <div style=\"display:grid;grid-template-columns:1.4fr 1.4fr 1fr 0.7fr;gap:12px;padding:14px 18px;border-bottom:1px solid #f3f4f6;align-items:center;\">\n                      <div>\n                        <div style=\"font-weight:700;font-size:13.5px;color:#111827;\">{{ o.id }}</div>\n                        <div style=\"font-size:12px;color:#9ca3af;\">{{ o.buyer }}</div>\n                      </div>\n                      <div style=\"font-size:12.5px;color:#4b5563;\">{{ o.items }}<div style=\"font-size:11.5px;color:#9ca3af;margin-top:1px;\">{{ o.fulfill }}</div></div>\n                      <span style=\"{{ o.statusStyle }}\">{{ o.status }}</span>\n                      <div style=\"font-weight:700;font-size:14px;color:#111827;text-align:right;\">{{ o.total }}</div>\n                    </div>\n                  </sc-for>\n                </div>\n              </div>\n            </sc-if>\n\n          </div>\n        </main>\n      </div>\n    </div>\n  </sc-if>\n\n  <!-- ============ BUYER FOOTER ============ -->\n  <sc-if value=\"{{ showTopNav }}\" hint-placeholder-val=\"{{ true }}\">\n    <footer style=\"border-top:1px solid #e5e7eb;margin-top:auto;background:#fff;\">\n      <div style=\"max-width:1200px;margin:0 auto;padding:18px 24px;display:flex;justify-content:space-between;font-size:12.5px;color:#9ca3af;\">\n        <span>AgriScheme Marketplace — direct from Malaysian farms</span>\n        <span>Prototype · all data is sample data</span>\n      </div>\n    </footer>\n  </sc-if>\n</div>\n\n</x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;browseLayout&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;grid&quot;, &quot;list&quot;], &quot;default&quot;: &quot;grid&quot;, &quot;tsType&quot;: &quot;'grid' | 'list'&quot;, &quot;section&quot;: &quot;Layout&quot; },\n  &quot;showBanner&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Layout&quot; }\n}\">\nclass Component extends DCLogic {\n  state = {\n    screen: 'browse',\n    sellerTab: 'dash',\n    cart: [],\n    productId: null,\n    qty: 1,\n    justAdded: false,\n    cat: 'All',\n    type: 'All',\n    query: '',\n    fulfill: 'pickup',\n    pay: 'fpx',\n    quoteSent: false,\n    quoteQty: '',\n    onboardRole: 'household',\n    formName: '', formCat: 'Vegetables', formType: 'now', formPrice: '', formUnit: '',\n    formError: false,\n    extraListings: []\n  };\n\n  productImages = {1:1,2:1,3:1,4:1,5:1,6:1,7:1,8:1,9:1,10:1};\n\n  products = [\n    { id: 1, name: 'Cameron Highlands Tomatoes', farm: 'Ladang Segar', distance: 'Cameron Highlands', cat: 'Vegetables', type: 'now', priceN: 6.5, price: 'RM6.50', unit: 'per kg', rating: '4.9', reviews: 128, blurb: 'Picked this morning', description: 'Vine-ripened tomatoes grown in the cool Cameron Highlands, picked the same morning they are listed. Grown with minimal spray.', imgLabel: 'tomato', hue: 15 },\n    { id: 2, name: 'Musang King Durian — Pre-order', farm: 'Dusun Raub', distance: 'Raub, Pahang', cat: 'Fruit', type: 'preorder', priceN: 55, price: 'RM55', unit: 'per kg', rating: '4.9', reviews: 214, blurb: 'Peak season', harvestDate: 'end of June', description: 'Reserve premium D197 Musang King from our Raub orchard. Tree-dropped, graded, and delivered within 24 hours of harvest.', imgLabel: 'durian', hue: 75 },\n    { id: 3, name: 'Weekly Sayur Box', farm: 'Kebun Komuniti Selangor', distance: 'Sepang, Selangor', cat: 'Boxes & Shares', type: 'sub', priceN: 35, price: 'RM35', unit: 'per week', rating: '5.0', reviews: 176, blurb: '8–10 seasonal items', description: 'A rotating weekly box of 8–10 seasonal vegetables and herbs from our community farm. Pause or skip any week. Includes simple resepi cards.', imgLabel: 'sayur box', hue: 140 },\n    { id: 4, name: 'Raw Kelulut Honey', farm: 'Ladang Lebah Kelantan', distance: 'Bachok, Kelantan', cat: 'Pantry', type: 'now', priceN: 28, price: 'RM28', unit: 'per 250g jar', rating: '4.8', reviews: 341, blurb: 'Stingless-bee, unheated', description: 'Tangy-sweet raw kelulut (stingless bee) honey, harvested and jarred without heating. Single-origin from our Kelantan apiary.', imgLabel: 'honey', hue: 55 },\n    { id: 5, name: 'Bulk Chilli (Cili Merah)', farm: 'Ladang Cili Johor', distance: 'Kluang, Johor', cat: 'Vegetables', type: 'bulk', priceN: 8, price: 'from RM8', unit: 'per kg', minOrder: '50 kg', rating: '4.7', reviews: 42, blurb: '50 kg minimum', description: 'Restaurant-grade red chilli, graded and packed. Volume pricing available — request a quote for your quantity and we reply same-day.', imgLabel: 'chilli', hue: 25 },\n    { id: 6, name: 'Kampung Chicken Eggs', farm: 'Ternakan Melaka', distance: 'Jasin, Melaka', cat: 'Dairy & Eggs', type: 'now', priceN: 13, price: 'RM13', unit: 'per dozen', rating: '4.9', reviews: 187, blurb: 'Free-range, daily', description: 'Eggs from free-roaming kampung hens, collected every morning. Deep golden yolks.', imgLabel: 'eggs', hue: 60 },\n    { id: 7, name: 'Harumanis Mango — Pre-order', farm: 'Dusun Perlis', distance: 'Kangar, Perlis', cat: 'Fruit', type: 'preorder', priceN: 45, price: 'RM45', unit: 'per 3kg box', rating: '4.8', reviews: 96, blurb: 'April–June harvest', harvestDate: 'mid-April', description: 'Reserve a box of the famous Perlis Harumanis — fragrant, honey-sweet mangoes. First-pick fruit, hand-sorted.', imgLabel: 'mango', hue: 70 },\n    { id: 8, name: 'Bulk Red Onions (Bawang)', farm: 'Ladang Kedah', distance: 'Pendang, Kedah', cat: 'Vegetables', type: 'bulk', priceN: 4.5, price: 'from RM4.50', unit: 'per kg', minOrder: '100 kg', rating: '4.6', reviews: 28, blurb: '100 kg minimum', description: 'Cured storage onions with consistent sizing for prep kitchens. Volume pricing by quote.', imgLabel: 'onion', hue: 45 },\n    { id: 9, name: 'Beras Wangi Rice Share', farm: 'Padi Sekinchan', distance: 'Sekinchan, Selangor', cat: 'Rice & Grains', type: 'sub', priceN: 40, price: 'RM40', unit: 'per month', rating: '4.9', reviews: 154, blurb: '5kg fresh-milled', description: 'A monthly 5kg bag of fragrant rice, milled to order from our Sekinchan paddy fields. Fresher than anything on the shelf.', imgLabel: 'rice', hue: 90 },\n    { id: 10, name: 'Fresh Herbs (Daun Kesum)', farm: 'Kebun Komuniti Selangor', distance: 'Sepang, Selangor', cat: 'Vegetables', type: 'now', priceN: 3, price: 'RM3', unit: 'per bunch', rating: '4.8', reviews: 73, blurb: 'Cut to order', description: 'Aromatic Vietnamese mint (daun kesum) and mixed local herbs, cut to order the morning of pickup or delivery.', imgLabel: 'herbs', hue: 135 }\n  ];\n\n  typeMeta = {\n    now:      { badge: 'Buy now',      bg: '#dcfce7', fg: '#15803d' },\n    preorder: { badge: 'Pre-order',    bg: '#fef3c7', fg: '#b45309' },\n    sub:      { badge: 'Subscription', bg: '#dbeafe', fg: '#1d4ed8' },\n    bulk:     { badge: 'Wholesale',    bg: '#f3e8ff', fg: '#7e22ce' }\n  };\n\n  fmt(n) { return 'RM' + n.toFixed(2); }\n\n  imgBg(hue, h, extra, img) {\n    var base = 'height:' + h + ';background-position:center;background-size:cover;background-repeat:no-repeat;display:flex;align-items:flex-end;justify-content:center;' + (extra || '');\n    if (img) return base;\n    return base + 'background-image:radial-gradient(120% 120% at 26% 16%,oklch(0.975 0.02 ' + hue + '),transparent 62%),linear-gradient(150deg,oklch(0.945 0.045 ' + hue + '),oklch(0.885 0.06 ' + hue + '));';\n  }\n\n  badgeStyle(t) {\n    const m = this.typeMeta[t];\n    return 'display:inline-block;padding:3px 9px;border-radius:999px;background:' + m.bg + ';color:' + m.fg + ';font-size:11px;font-weight:600;';\n  }\n\n  decorate(p) {\n    const m = this.typeMeta[p.type];\n    const img = (this.productImages && this.productImages[p.id]) || '';\n    return Object.assign({}, p, {\n      badge: m.badge,\n      badgeStyle: this.badgeStyle(p.type),\n      img: img,\n      imgClass: img ? ('pimg-' + p.id) : '',\n      imgLabel: img ? '' : p.imgLabel,\n      labelPill: img ? 'display:none;' : 'font:600 10px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:rgba(15,74,40,.6);background:rgba(255,255,255,.7);padding:4px 9px;border-radius:999px;margin-bottom:10px;box-shadow:0 1px 2px rgba(15,74,40,.08);',\n      labelPillBig: img ? 'display:none;' : 'font:600 11px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:rgba(15,74,40,.6);background:rgba(255,255,255,.7);padding:5px 11px;border-radius:999px;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,74,40,.08);',\n      imgStyle: this.imgBg(p.hue, '160px', '', img),\n      imgStyleRow: this.imgBg(p.hue, 'auto', 'width:148px;flex:none;', img),\n      imgStyleBig: this.imgBg(p.hue, '420px', 'border-radius:16px;border:1px solid #f3f4f6;', img),\n      imgStyleThumb: this.imgBg(p.hue, '52px', 'width:52px;border-radius:10px;flex:none;', img),\n      isBulk: p.type === 'bulk',\n      isPreorder: p.type === 'preorder',\n      addLabel: p.type === 'sub' ? 'Subscribe' : (p.type === 'preorder' ? 'Reserve' : (p.type === 'bulk' ? 'Add at list price' : 'Add to cart')),\n      open: () => this.setState({ screen: 'product', productId: p.id, qty: 1, justAdded: false, quoteSent: false, quoteQty: '' })\n    });\n  }\n\n  chipStyle(active) {\n    return 'height:34px;padding:0 15px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid ' +\n      (active ? '#1a6b3c;background:#1a6b3c;color:#fff;' : '#e5e7eb;background:#fff;color:#374151;');\n  }\n\n  updateQty(id, qty) {\n    this.setState(st => ({\n      cart: qty < 1 ? st.cart.filter(c => c.id !== id) : st.cart.map(c => c.id === id ? { id, qty } : c)\n    }));\n  }\n\n  renderVals() {\n    const s = this.state;\n    const layout = this.props.browseLayout ?? 'grid';\n    const all = this.products.concat(s.extraListings);\n\n    const filtered = all.filter(p =>\n      (s.cat === 'All' || p.cat === s.cat) &&\n      (s.type === 'All' || p.type === s.type) &&\n      (!s.query || (p.name + ' ' + p.farm).toLowerCase().includes(s.query.toLowerCase()))\n    );\n\n    const cats = ['All', 'Vegetables', 'Fruit', 'Rice & Grains', 'Dairy & Eggs', 'Pantry', 'Boxes & Shares'];\n    const types = [['All', 'All types'], ['now', 'Buy now'], ['preorder', 'Pre-order'], ['sub', 'Subscriptions'], ['bulk', 'Wholesale']];\n\n    const sel = all.find(p => p.id === s.productId);\n    const selD = sel ? this.decorate(sel) : this.decorate(this.products[0]);\n\n    const cartItems = s.cart.map(c => {\n      const p = all.find(x => x.id === c.id);\n      const d = this.decorate(p);\n      return Object.assign(d, {\n        qty: c.qty,\n        lineTotal: this.fmt(p.priceN * c.qty),\n        inc: () => this.updateQty(c.id, c.qty + 1),\n        dec: () => this.updateQty(c.id, c.qty - 1),\n        remove: () => this.setState(st => ({ cart: st.cart.filter(x => x.id !== c.id) }))\n      });\n    });\n    const subtotalN = s.cart.reduce((sum, c) => {\n      const p = all.find(x => x.id === c.id); return sum + p.priceN * c.qty;\n    }, 0);\n    const fulfillDefs = [\n      { key: 'pickup', label: 'Farm pickup', note: 'Free · ready next day', cost: 0 },\n      { key: 'local', label: 'Local delivery', note: subtotalN >= 100 ? 'Free over RM100' : 'RM6 · within 30 km', cost: subtotalN >= 100 ? 0 : 6 },\n      { key: 'ship', label: 'Courier (Pos Laju)', note: 'RM12 · 2–3 days nationwide', cost: 12 }\n    ];\n    const fSel = fulfillDefs.find(f => f.key === s.fulfill);\n\n    const optRow = (active, accent) => 'display:flex;flex-direction:column;gap:2px;padding:11px 14px;border-radius:11px;cursor:pointer;border:1px solid ' +\n      (active ? (accent || '#1a6b3c') + ';background:#f0fdf4;' : '#e5e7eb;background:#fff;');\n\n    const payDefs = [\n      { key: 'fpx', label: 'FPX online banking', note: 'Maybank2u, CIMB Clicks, etc.' },\n      { key: 'ewallet', label: 'E-wallet', note: 'Touch \\u2019n Go, GrabPay, Boost' },\n      { key: 'card', label: 'Credit / debit card', note: 'Visa, Mastercard' }\n    ];\n\n    const sellerBase = all.filter(p => p.farm === 'Kebun Komuniti Selangor');\n    const stockMap = { 3: ['In stock', true], 10: ['Low stock', false] };\n    const sellerListings = sellerBase.map((p, i) => {\n      const d = this.decorate(p);\n      const st = stockMap[p.id] || ['In stock', true];\n      return Object.assign(d, {\n        views: [412, 188][i] != null ? [412, 188][i] : 24,\n        stockLabel: st[0],\n        stockStyle: 'padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;' +\n          (st[1] ? 'background:#dcfce7;color:#15803d;' : 'background:#fef3c7;color:#b45309;')\n      });\n    });\n\n    const oStyle = (kind) => 'padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;justify-self:start;' +\n      (kind === 'new' ? 'background:#dbeafe;color:#1d4ed8;' : kind === 'pack' ? 'background:#fef3c7;color:#b45309;' : 'background:#dcfce7;color:#15803d;');\n    const sellerOrders = [\n      { id: '#AS-2477', buyer: 'Restoran Selera Kampung', items: '2× Sayur Box, 12× Herbs', fulfill: 'Local delivery · Thu', status: 'New', statusStyle: oStyle('new'), total: 'RM100' },\n      { id: '#AS-2474', buyer: 'Nurul H.', items: '1× Sayur Box', fulfill: 'Farm pickup · Wed', status: 'Pack today', statusStyle: oStyle('pack'), total: 'RM35' },\n      { id: '#AS-2469', buyer: 'David L.', items: '6× Herbs', fulfill: 'Courier', status: 'Shipped', statusStyle: oStyle('done'), total: 'RM18' },\n      { id: '#AS-2465', buyer: 'Pasar Mini Aman', items: '4× Sayur Box', fulfill: 'Local delivery · Mon', status: 'Delivered', statusStyle: oStyle('done'), total: 'RM140' }\n    ];\n\n    const kpis = [\n      { icon: 'RM', value: 'RM1,284', label: \"This week's sales\", delta: '▲ 18% vs last week', good: true, iconHue: '#dcfce7', iconFg: '#15803d' },\n      { icon: '☰', value: '7', label: 'Open orders', delta: '2 to pack today', good: false, iconHue: '#fef3c7', iconFg: '#b45309' },\n      { icon: '◎', value: '43', label: 'CSA subscribers', delta: '▲ 3 new this week', good: true, iconHue: '#dbeafe', iconFg: '#1d4ed8' },\n      { icon: '★', value: '4.9', label: 'Store rating', delta: '212 reviews', good: null, iconHue: '#f3e8ff', iconFg: '#7e22ce' }\n    ].map(k => ({\n      icon: k.icon, value: k.value, label: k.label, delta: k.delta,\n      iconWrap: 'width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;background:' + k.iconHue + ';color:' + k.iconFg + ';',\n      deltaStyle: 'font-size:12px;margin-top:5px;font-weight:600;color:' + (k.good === true ? '#15803d' : k.good === false ? '#b45309' : '#9ca3af') + ';'\n    }));\n\n    const salesRaw = [\n      { name: 'Weekly Sayur Box', amount: 'RM620', pct: 100 },\n      { name: 'Beras Wangi Share', amount: 'RM380', pct: 61 },\n      { name: 'Fresh Herbs', amount: 'RM184', pct: 30 },\n      { name: 'Kelulut Honey', amount: 'RM100', pct: 16 }\n    ];\n    const salesBars = salesRaw.map(b => Object.assign({}, b, {\n      barStyle: 'width:' + b.pct + '%;height:100%;background:#1a6b3c;border-radius:999px;'\n    }));\n\n    const roleCard = (r) => 'border:1.5px solid ' + (s.onboardRole === r ? '#1a6b3c;background:#f0fdf4;' : '#e5e7eb;background:#fff;') +\n      'border-radius:12px;padding:14px 10px;cursor:pointer;text-align:center;';\n\n    const topTab = (active) => 'height:34px;padding:0 15px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;' +\n      (active ? 'background:#fff;color:#1a6b3c;box-shadow:0 1px 2px rgba(0,0,0,.08);' : 'background:none;color:#6b7280;');\n\n    const sellerTabDefs = [['dash', 'Dashboard'], ['listings', 'Listings'], ['new', 'New listing'], ['orders', 'Orders']];\n\n    return {\n      showTopNav: s.screen !== 'seller' && s.screen !== 'onboard',\n      buyTabStyle: topTab(s.screen !== 'seller'),\n      sellTabStyle: topTab(s.screen === 'seller'),\n      setBuyerMode: () => this.setState({ screen: 'browse' }),\n      setSellerMode: () => this.setState({ screen: 'seller' }),\n      goHome: () => this.setState({ screen: 'browse' }),\n      goBrowse: () => this.setState({ screen: 'browse' }),\n      goCart: () => this.setState({ screen: 'cart' }),\n      goCheckout: () => this.setState({ screen: 'checkout' }),\n      goOnboard: () => this.setState({ screen: 'onboard' }),\n      cartCount: s.cart.reduce((n, c) => n + c.qty, 0),\n\n      isOnboard: s.screen === 'onboard',\n      isBrowse: s.screen === 'browse',\n      isProduct: s.screen === 'product',\n      isCart: s.screen === 'cart',\n      isCheckout: s.screen === 'checkout',\n      isConfirm: s.screen === 'confirm',\n      isSeller: s.screen === 'seller',\n\n      pickRoleHousehold: () => this.setState({ onboardRole: 'household' }),\n      pickRoleBusiness: () => this.setState({ onboardRole: 'business' }),\n      pickRoleFarmer: () => this.setState({ onboardRole: 'farmer' }),\n      roleCardHousehold: roleCard('household'),\n      roleCardBusiness: roleCard('business'),\n      roleCardFarmer: roleCard('farmer'),\n      onboardNameLabel: s.onboardRole === 'farmer' ? 'Farm name' : (s.onboardRole === 'business' ? 'Business name' : 'Your name'),\n      onboardNamePlaceholder: s.onboardRole === 'farmer' ? 'e.g. Kebun Komuniti Selangor' : (s.onboardRole === 'business' ? 'e.g. Restoran Selera' : 'e.g. Nurul Huda'),\n      onboardCta: s.onboardRole === 'farmer' ? 'Start selling' : 'Start shopping',\n      finishOnboard: () => this.setState({ screen: s.onboardRole === 'farmer' ? 'seller' : 'browse' }),\n\n      showBanner: this.props.showBanner ?? true,\n      query: s.query,\n      onQuery: (e) => this.setState({ query: e.target.value }),\n      resultLine: filtered.length + ' listings from farms across Malaysia',\n      catChips: cats.map(c => ({ label: c, style: this.chipStyle(s.cat === c), pick: () => this.setState({ cat: c }) })),\n      typeChips: types.map(([k, label]) => ({ label, style: this.chipStyle(s.type === k), pick: () => this.setState({ type: k }) })),\n      shownProducts: filtered.map(p => this.decorate(p)),\n      isGridLayout: layout === 'grid',\n      isListLayout: layout === 'list',\n\n      sel: selD,\n      qty: s.qty,\n      qtyUp: () => this.setState(st => ({ qty: st.qty + 1 })),\n      qtyDown: () => this.setState(st => ({ qty: Math.max(1, st.qty - 1) })),\n      addToCart: () => this.setState(st => {\n        const existing = st.cart.find(c => c.id === st.productId);\n        const cart = existing\n          ? st.cart.map(c => c.id === st.productId ? { id: c.id, qty: c.qty + st.qty } : c)\n          : st.cart.concat([{ id: st.productId, qty: st.qty }]);\n        return { cart, justAdded: true };\n      }),\n      justAdded: s.justAdded,\n      quoteSent: s.quoteSent,\n      quoteNotSent: !s.quoteSent,\n      quoteQty: s.quoteQty,\n      onQuoteQty: (e) => this.setState({ quoteQty: e.target.value }
