crop: banana
disease:
  name: banana_bunchy_top
  local_name: penyakit pucuk berjumbai pisang
  pathogen:
    type: virus
    species: Banana bunchy top virus
  symptoms:
    visual:
    - Dark-green streaks of irregular dots and dashes ('Morse code' pattern) along
      the secondary veins of the leaf lamina, midrib and petiole, best seen against
      light
    - Successive leaves emerge progressively shorter, narrower and more erect, crowding
      into a rosette or 'bunchy top' at the crown
    - Chlorotic (yellow), upward-curled and brittle leaf margins; leaves snap easily
    growth: Severely stunted plants that usually fail to produce a bunch, or yield
      small, distorted, unmarketable bunches; entire infected mat is effectively a
      total loss. BBTV is one of the most damaging viral constraints to pisang (banana)
      cultivation in Malaysia, forcing abandonment of smallholder plots, particularly
      for pisang berangan and pisang mas. No curative chemical treatment exists for
      the virus; management targets the banana aphid vector and removal of inoculum.
  severity_stages:
  - stage: early
    signs: Faint dark-green dot-and-dash streaks on the youngest leaves and petiole;
      plant still appears vigorous and of near-normal size
  - stage: moderate
    signs: Newly emerged leaves visibly shorter, narrower and more upright with chlorotic,
      curled and brittle margins; bunching beginning at the crown; growth slowing
  - stage: severe
    signs: Pronounced rosette of stunted, bunched leaves at the top; plant growth
      ceases, no bunch is produced or the bunch aborts; attached suckers also show
      symptoms
  treatments:
  - compound: imidacloprid
    dosage_grounding:
      verified: false
      note: AI-generated agronomic estimate, not the DOA-registered label dose (the
        authoritative source mypesticide.doa.gov.my is login-gated). Verify the rate
        on the product label before mixing or spraying.
      doa_residue_reference: 'No Pisang (banana) residue record for imidacloprid in
        mymrl.doa.gov.my; neither dose nor PHI is grounded in a public DOA source.'
    trade_name: Confidor 200SL
    dosage: 0.5 ml per litre water
    method: foliar spray
    frequency: every 14 days while the aphid vector is active; apply before roguing
      infected plants to prevent vector dispersal
    pre_harvest_interval_days: 14
    phi_grounding:
      verified: false
      status: unverified
      source: null
    phi_unverified: true
    regulatory_status: MY_approved
  - compound: thiamethoxam
    dosage_grounding:
      verified: false
      note: AI-generated agronomic estimate, not the DOA-registered label dose (the
        authoritative source mypesticide.doa.gov.my is login-gated). Verify the rate
        on the product label before mixing or spraying.
      doa_residue_reference: 'No Pisang (banana) residue record for thiamethoxam in
        mymrl.doa.gov.my; neither dose nor PHI is grounded in a public DOA source.'
    trade_name: Actara 25WG
    dosage: 0.2 g per litre water
    method: foliar spray
    frequency: every 14 days, alternated with imidacloprid to manage resistance
    pre_harvest_interval_days: 14
    phi_grounding:
      verified: false
      status: unverified
      source: null
    phi_unverified: true
    regulatory_status: MY_approved
  cultural_controls:
  - Rogue and destroy infected plants completely — kill the plant in situ (e.g. herbicide
    injection) before uprooting the corm and all suckers, so the entire mat is eradicated
    and the banana aphid (Pentalonia nigronervosa) is not driven onto healthy plants
  - Plant only certified virus-free tissue-cultured plantlets or clean suckers sourced
    from disease-free areas; never move planting material out of infected districts
    (quarantine), and inspect fields regularly, especially within ~20 m of previously
    infected mats
  rotation_partner: There is no curative chemical treatment for the virus itself; the
    two listed vector insecticides (imidacloprid and thiamethoxam) are both neonicotinoids
    that share a mode of action, so alternating between them alone does not manage
    resistance. Rely primarily on non-chemical rotation — plant certified virus-free
    tissue-cultured plantlets, practise strict roguing and quarantine, and avoid repeated
    reliance on a single neonicotinoid for aphid control.
  application: Apply the listed vector insecticides as a foliar spray every 14 days
    while the banana aphid is active, and spray before roguing infected plants so the
    vector is not driven onto healthy mats. Spray in the early morning or late afternoon,
    do not spray just before expected rain, and observe the stated 14-day interval.
    Wear PPE — gloves, mask and long sleeves — when mixing and applying, and follow
    the pre-harvest interval on the product label.
  instructions_bm: Perhatikan corak jalur hijau gelap 'kod Morse' dan daun yang semakin
    pendek berkumpul di pucuk. Cabut dan musnahkan pokok berjangkit sepenuhnya, dan
    semburkan racun kutu daun setiap 14 hari sebelum mencabut pokok untuk elak kutu
    berpindah. Sembur pada awal pagi atau lewat petang, elak sebelum hujan, dan pakai
    sarung tangan, penutup mulut serta lengan panjang semasa menyembur.
