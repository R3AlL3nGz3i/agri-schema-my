crop: tomato
disease:
  name: bacterial_canker
  local_name: kanker bakteria
  pathogen:
    type: bacteria
    species: Clavibacter michiganensis subsp. michiganensis
  symptoms:
    visual:
    - Layu sebelah (unilateral) pada daun bawah — tepi daun melengkung ke atas, mengering
      dan perang sementara bahagian lain pokok kelihatan sihat
    - Jaluran perang muda hingga keperangan pada batang dan tangkai daun yang akhirnya
      merekah membentuk kanker terbuka
    - Bintik 'mata burung' pada buah — bintik kecil putih dengan pusat perang gelap,
      bertimbul; bila batang dipotong kelihatan reput vaskular kekuningan dengan lelehan
      bakteria
    growth: Penyakit bawaan benih (seedborne) yang serius; kehilangan hasil boleh
      mencapai 70-80% dalam wabak teruk, terutama di kawasan penanaman tanah tinggi
      (Cameron Highlands, Kundasang Sabah). Tiada rawatan kimia yang menyembuhkan
      sepenuhnya — pengurusan bergantung pada pencegahan.
  severity_stages:
  - stage: early
    signs: Tepi daun bawah melengkung dan layu sedikit secara sebelah; tiada simptom
      batang yang ketara; pokok masih kelihatan sihat dari jauh
  - stage: moderate
    signs: Pengeringan tepi daun (leaf scorch) merebak ke atas; jaluran cerah muncul
      pada batang dan tangkai; reput vaskular kekuningan kelihatan apabila batang
      dipotong
  - stage: severe
    signs: Kanker batang merekah terbuka; pokok reput, kerdil dan mati; buah menunjukkan
      bintik 'mata burung'; pereputan ladang berkelompok
  treatments:
  - compound: Copper hydroxide
    trade_name: Kocide 3000
    dosage: 1.5g per litre water
    method: foliar spray
    frequency: Setiap 7-10 hari sebagai langkah pencegahan/penyekatan, bermula awal
      pertumbuhan
    pre_harvest_interval_days: 1
    phi_source: 'APVMA/US EPA copper fungicide labels: 0-1 day PHI on tomato (contact inorganic). Foreign source, NOT a Malaysian DOA/LPRMP label.'
    phi_unverified: true
    regulatory_status: MY_approved
  - compound: Copper oxychloride
    trade_name: Cupravit OB 21
    dosage: 3g per litre water
    method: foliar spray
    frequency: Setiap 7-10 hari, berselang dengan produk kuprum lain
    pre_harvest_interval_days: 1
    phi_source: 'APVMA/US EPA copper fungicide labels: 0-1 day PHI on tomato (contact inorganic). Foreign source, NOT a Malaysian DOA/LPRMP label.'
    phi_unverified: true
    regulatory_status: MY_approved
  cultural_controls:
  - Guna benih bersijil bebas penyakit; rawat benih dengan air panas (50°C selama
    25 minit) kerana patogen ini bawaan benih
  - Amalkan giliran tanaman 2-3 tahun, elakkan tanaman keluarga terung (Solanaceae)
    berturut-turut
  - Cabut dan musnahkan (bakar/tanam dalam) pokok berjangkit serta sisa tanaman; jangan
    kompos
  - Sanitasi alat, pancang, tangan dan rumah lindung dengan peluntur/disinfektan antara
    pokok dan antara pusingan tanaman; elakkan kerja semasa daun basah
  rotation_partner: Tiada rawatan kimia yang menyembuhkan penyakit bakteria bawaan benih
    ini, dan kedua-dua rawatan tersenarai adalah sebatian kuprum (mod tindakan sama),
    jadi menyilih antaranya tidak memberi faedah pengurusan rintangan. Utamakan giliran
    kultura sebaliknya — giliran tanaman 2-3 tahun dengan tanaman bukan Solanaceae dan
    guna benih bersijil bebas penyakit yang dirawat air panas.
  application: Sapu sembur kuprum sebagai langkah pencegahan/penyekatan sahaja (bukan
    penyembuh), bermula awal pertumbuhan dan berselang antara produk kuprum. Sembur pada
    waktu pagi atau lewat petang, jangan sembur sebelum hujan, dan patuhi selang 7-10
    hari yang dinyatakan; elakkan bekerja semasa daun basah untuk kurangkan penyebaran
    bakteria. Pakai sarung tangan, penutup mulut dan lengan panjang semasa mencampur dan
    menyembur.
  instructions_bm: Penyakit ini bawaan benih dan tiada ubat penyembuh — utamakan benih
    bersijil, giliran tanaman dan sanitasi alat. Sebaik nampak layu sebelah atau jaluran
    pada batang, cabut dan musnahkan pokok berjangkit; sembur kuprum hanya sebagai
    pencegahan setiap 7-10 hari pada waktu pagi atau lewat petang dan bukan sebelum hujan.
    Pakai sarung tangan, penutup mulut dan lengan panjang.
