crop: tomato
disease:
  name: early_blight
  local_name: Hawar awal
  pathogen:
    type: fungi
    species: Alternaria solani
  symptoms:
    visual:
    - Bintik coklat gelap hingga hitam dengan corak cincin sepusat (rupa sasaran tembak
      / bull's-eye) pada daun tua dan daun bawah
    - Kawasan tisu menguning (klorosis) mengelilingi bintik, diikuti pengeringan dan
      keguguran daun bermula dari bahagian bawah pokok ke atas
    - Lesi gelap melekuk pada batang berhampiran tanah dan pada buah berdekatan kelopak
      (calyx), kadang dengan cincin sepusat
    growth: Defoliasi progresif mengurangkan luas fotosintesis dan mendedahkan buah
      kepada melecur matahari (sunscald); di kawasan tanah rendah Malaysia yang panas
      dan lembap, kehilangan hasil dianggarkan 20-40% terutama semasa musim hujan
  severity_stages:
  - stage: early
    signs: Bintik kecil (1-2 mm) berwarna coklat ke hitam pada daun paling tua / paling
      bawah, sering berhampiran permukaan tanah
  - stage: moderate
    signs: Lesi membesar 3-12 mm dengan cincin sepusat jelas dan halo kuning; daun
      bawah mula menguning dan gugur
  - stage: severe
    signs: Defoliasi meluas dari bawah ke atas, kanker pada batang, lesi pada buah,
      buah terdedah melecur matahari, dan pokok merosot
  treatments:
  - compound: Mancozeb
    dosage_grounding:
      verified: false
      note: AI-generated agronomic estimate, not the DOA-registered label dose (the
        authoritative source mypesticide.doa.gov.my is login-gated). Verify the rate
        on the product label before mixing or spraying.
      doa_residue_reference: No Tomato residue record for mancozeb in mymrl.doa.gov.my;
        neither dose nor PHI is grounded in a public DOA source.
    trade_name: Dithane M-45 (80% WP)
    dosage: 2.5 g per litre water
    method: foliar spray
    frequency: every 7-10 days, mula pada gejala pertama
    pre_harvest_interval_days: 7
    phi_grounding:
      verified: false
      status: unverified
      source: null
    phi_unverified: true
    regulatory_status: MY_approved
  - compound: Chlorothalonil
    dosage_grounding:
      verified: false
      note: AI-generated agronomic estimate, not the DOA-registered label dose (the
        authoritative source mypesticide.doa.gov.my is login-gated). Verify the rate
        on the product label before mixing or spraying.
      doa_residue_reference: Chlorothalonil registered on Tomato in mymrl.doa.gov.my/AIs/28
        (products ROVER, Macconil 75 WP, Etanil WP); portal grounds a 7-day PHI (matching
        this entry) but lists spray-rate figures without per-litre units, not a label
        dose.
    trade_name: Daconil 500 SC
    dosage: 2 ml per litre water
    method: foliar spray
    frequency: every 7-10 days semasa keadaan lembap menggalakkan penyakit
    pre_harvest_interval_days: 7
    phi_grounding:
      verified: true
      status: verified
      source: mymrl.doa.gov.my/AIs/28
    regulatory_status: MY_approved
  cultural_controls:
  - Giliran tanaman dengan tanaman bukan keluarga Solanaceae (elak tomato, cili, terung,
    kentang) selama 2-3 tahun
  - Buang dan musnahkan daun bawah berjangkit serta sisa tanaman; elak pengairan curahan
    atas (overhead), gunakan pengairan titis
  - Sokong pokok dengan pancang/teres, jarak tanaman mencukupi untuk pengudaraan,
    dan sungkupan (mulching) bagi mengurangkan percikan tanah
  - Guna benih/anak benih bebas penyakit yang disahkan dan varieti toleran jika ada
  rotation_partner: Silih antara dua rawatan tersenarai untuk melambatkan rintangan
    — guna Mancozeb (Dithane M-45) dan Chlorothalonil (Daconil 500 SC) berselang.
    Kedua-duanya fungisid pelindung berbilang tapak (multi-site) dengan sebatian berbeza,
    jadi menyilih produk mengurangkan tekanan berterusan pada satu bahan; sokong pula
    dengan giliran tanaman bukan Solanaceae dan varieti toleran.
  application: Sembur sebagai fungisid pelindung daun, bermula pada gejala pertama
    dan tumpu pada daun bawah/tua yang mula-mula dijangkiti. Sembur pada waktu pagi
    atau lewat petang dan jangan sembur sebelum hujan supaya lapisan pelindung sempat
    kering. Patuhi selang 7-10 hari dan tempoh pra-tuai 7 hari sebelum memetik buah.
    Pakai sarung tangan, penutup mulut dan lengan panjang semasa mencampur dan menyembur.
    Sahkan dos sebenar pada label produk berdaftar sebelum mencampur atau menyembur.
  instructions_bm: Perhatikan bintik coklat bercincin sepusat pada daun tua/bawah;
    mula sembur pada gejala pertama, silih antara Mancozeb dan Chlorothalonil setiap
    7-10 hari pada waktu pagi atau lewat petang dan bukan sebelum hujan. Patuhi tempoh
    pra-tuai 7 hari dan pakai sarung tangan, penutup mulut serta lengan panjang. Sahkan
    dos sebenar pada label produk berdaftar sebelum mencampur atau menyembur.
