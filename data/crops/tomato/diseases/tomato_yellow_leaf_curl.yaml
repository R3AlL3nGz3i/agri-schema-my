crop: tomato
disease:
  name: tomato_yellow_leaf_curl
  local_name: penyakit keriting daun kuning tomato
  pathogen:
    type: virus
    species: Tomato yellow leaf curl virus
  symptoms:
    visual:
    - Upward curling and cupping of young leaflets at the shoot tip
    - Interveinal and marginal yellowing (chlorosis) of leaves
    - Reduced leaf size with crumpled, leathery texture and shortened internodes giving
      a bushy, stunted appearance
    - Flower abortion and poor fruit set on infected plants
    growth: Major virus constraint for tomato in Malaysia, especially Cameron Highlands
      and lowland open-field plantings; early infection can cause 70-100% yield loss
      as affected plants set little or no marketable fruit.
  severity_stages:
  - stage: early
    signs: A few apical leaves show slight upward curling and faint marginal yellowing;
      whitefly (Bemisia tabaci) adults and nymphs present on lower leaf surfaces.
  - stage: moderate
    signs: Pronounced leaf cupping and interveinal chlorosis across upper canopy,
      slowed shoot growth, and visibly shortened internodes.
  - stage: severe
    signs: Severe stunting with a bushy rosette appearance, extensive yellowing, widespread
      flower drop, and drastically reduced or absent fruit yield.
  treatments:
  - compound: imidacloprid
    trade_name: Confidor 200 SL
    dosage: 0.5 ml per litre water
    method: foliar spray
    frequency: every 7-10 days when whitefly threshold is exceeded, rotated with a
      different mode of action
    pre_harvest_interval_days: 3
    phi_source: 'APVMA (Australia) product label: 3-day PHI for imidacloprid on tomato. Foreign source, NOT a Malaysian DOA/LPRMP label.'
    phi_unverified: true
    regulatory_status: MY_approved
  - compound: thiamethoxam
    trade_name: Actara 25 WG
    dosage: 0.2 g per litre water
    method: foliar spray
    frequency: every 7-10 days during whitefly pressure, alternated with non-neonicotinoid
      insecticides to manage resistance
    pre_harvest_interval_days: 3
    phi_unverified: true
    regulatory_status: MY_approved
  cultural_controls:
  - Plant TYLCV-tolerant or resistant tomato varieties and raise seedlings under insect-proof
    netting or screenhouse conditions
  - Rogue and destroy infected plants early, control whitefly with yellow sticky traps
    and reflective silver plastic mulch, and keep fields and surroundings free of
    alternative weed hosts
  rotation_partner: The virus itself has no chemical cure; the two listed treatments target
    the whitefly vector and are both neonicotinoids (imidacloprid and thiamethoxam, same
    mode of action), so alternating only between them does not manage resistance. Rotate
    these neonicotinoids with insecticides of a different mode of action for vector control,
    and rely primarily on cultural rotation — plant TYLCV-tolerant/resistant varieties and
    raise seedlings under insect-proof netting.
  application: Spray the listed insecticides against the whitefly vector, not as a cure
    for the virus, and only when the whitefly threshold is exceeded. Spray in the early
    morning or late afternoon and not just before rain, keep to the stated 7-10 day interval,
    and observe the 3-day pre-harvest interval. Rotate with a different mode of action to
    manage resistance, and wear gloves, a mask and long sleeves when mixing and spraying.
  instructions_bm: Penyakit virus ini disebarkan lalat putih dan tiada ubat penyembuh —
    guna varieti tahan, semai anak benih di bawah jaring kalis serangga, dan cabut serta
    musnahkan pokok berjangkit awal. Sembur racun lalat putih hanya bila bilangannya
    melebihi ambang, silih dengan mod tindakan berbeza, pada waktu pagi atau lewat petang
    dan bukan sebelum hujan; patuhi tempoh pra-tuai 3 hari. Pakai sarung tangan, penutup
    mulut dan lengan panjang.
