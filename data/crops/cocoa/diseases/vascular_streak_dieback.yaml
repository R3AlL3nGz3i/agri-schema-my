      doa_residue_reference: No Biji Koko (cocoa) residue record for copper hydroxide
        in mymrl.doa.gov.my; neither dose nor PHI is grounded in a public DOA source.
    trade_name: Kocide 3000
    dosage: 2 g per litre water
    method: foliar spray
    frequency: Protective spray on the new flush every 2-3 weeks during the wet, high-sporulation
      season
    pre_harvest_interval_days: 7
