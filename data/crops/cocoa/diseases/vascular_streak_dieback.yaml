crop: cocoa
disease:
  name: vascular_streak_dieback
  local_name: penyakit mati rosot (VSD) / mati rosot jalur pembuluh
  pathogen:
    type: fungi
    species: Ceratobasidium theobromae
  symptoms:
    visual:
    - Yellowing (chlorosis) of one or two leaves on the second or third flush behind
      the shoot tip, with scattered green spots or flecks on the yellow background
    - Premature leaf fall starting in the middle of branches, leaving bare twigs;
      leaf scars show three dark dots (discoloured vascular traces)
    - Brown to greyish-brown streaking of the xylem seen when an infected green stem
      is split longitudinally; lenticels on affected stems become swollen and roughened
    growth: A serious disease of cocoa in Malaysia, most damaging in nurseries and
      young field plantings where it can kill seedlings outright; in mature trees
      it causes progressive canopy loss and reduced pod yield. Historically a major
      constraint to cocoa production in Sabah and Peninsular Malaysia.
  severity_stages:
  - stage: early
    signs: Chlorosis with green flecking on a single leaf or flush; one shoot affected;
      vascular browning only just beginning at the leaf trace
  - stage: moderate
    signs: Defoliation of affected branches with progressive dieback down the twig;
      distinct brown vascular streaking in the xylem; swollen lenticels; several branches
      infected
  - stage: severe
    signs: Extensive dieback of main branches or death of the whole plant (common
      in seedlings and young trees); bare candelabra-like canopy with secondary invasion
      by other pathogens
  treatments:
  - compound: hexaconazole
    dosage_grounding:
      verified: false
      note: AI-generated agronomic estimate, not the DOA-registered label dose (the
        authoritative source mypesticide.doa.gov.my is login-gated). Verify the rate
        on the product label before mixing or spraying.
      doa_residue_reference: No Biji Koko (cocoa) residue record for hexaconazole
        in mymrl.doa.gov.my; neither dose nor PHI is grounded in a public DOA source.
    trade_name: Anvil 5SC
    dosage: 1 ml per litre water
    method: foliar spray
    frequency: Spray the young flush at each new leaf flush, about every 3-4 weeks
      during periods of active flushing and wet weather
    pre_harvest_interval_days: 14
    phi_grounding:
      verified: false
      status: unverified
      source: null
    phi_unverified: true
    regulatory_status: MY_approved
  - compound: copper hydroxide
    dosage_grounding:
      verified: false
      note: AI-generated agronomic estimate, not the DOA-registered label dose (the
        authoritative source mypesticide.doa.gov.my is login-gated). Verify the rate
