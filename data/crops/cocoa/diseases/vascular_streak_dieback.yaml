crop: cocoa
disease:
  name: vascular_streak_dieback
  local_name: penyakit mati rosot (VSD) / mati rosot jalur pembuluh
  pathogen:
    type: fungi
    species: Ceratobasidium theobromae
  symptoms:
    visual:
    - Yellowing (chlorosis) of one or two leaves on the second or third flush behind
      the shoot tip, with scattered green spots or flecks on the yellow background
    - Premature leaf fall starting in the middle of branches, leaving bare twigs;
      leaf scars show three dark dots (discoloured vascular traces)
    - Brown to greyish-brown streaking of the xylem seen when an infected green stem
      is split longitudinally; lenticels on affected stems become swollen and roughened
    growth: A serious disease of cocoa in Malaysia, most damaging in nurseries and
      young field plantings where it can kill seedlings outright; in mature trees
      it causes progressive canopy loss and reduced pod yield. Historically a major
      constraint to cocoa production in Sabah and Peninsular Malaysia.
  severity_stages:
  - stage: early
    signs: Chlorosis with green flecking on a single leaf or flush; one shoot affected;
      vascular browning only just beginning at the leaf trace
  - stage: moderate
    signs: Defoliation of affected branches with progressive dieback down the twig;
      distinct brown vascular streaking in the xylem; swollen lenticels; several branches
      infected
  - stage: severe
    signs: Extensive dieback of main branches or death of the whole plant (common
      in seedlings and young trees); bare candelabra-like canopy with secondary invasion
      by other pathogens
  treatments:
  - compound: hexaconazole
    trade_name: Anvil 5SC
    dosage: 1 ml per litre water
    method: foliar spray
    frequency: Spray the young flush at each new leaf flush, about every 3-4 weeks
      during periods of active flushing and wet weather
    pre_harvest_interval_days: null
    regulatory_status: MY_approved
  - compound: copper hydroxide
    trade_name: Kocide 3000
    dosage: 2 g per litre water
    method: foliar spray
    frequency: Protective spray on the new flush every 2-3 weeks during the wet, high-sporulation
      season
    pre_harvest_interval_days: null
    regulatory_status: MY_approved
  cultural_controls:
  - 'Sanitation pruning: cut infected branches at least 30 cm below the lowest point
    of visible vascular streaking and remove or burn the prunings'
  - Plant tolerant/resistant cocoa clones recommended by Lembaga Koko Malaysia and
    raise nursery seedlings under cover, away from infected mature canopies that release
    basidiospores
  - Maintain an open canopy, adequate spacing and good drainage to reduce humidity
    and leaf wetness that favour spore infection of young flush
  rotation_partner: Alternate the two listed fungicides, which have different modes
    of action, to manage resistance — rotate hexaconazole (a systemic triazole) with
    copper hydroxide (a multi-site protectant) rather than spraying the triazole
    repeatedly on its own. This systemic/protectant alternation spreads selection
    pressure across the two chemistries already in the entry.
  application: Apply both as a foliar spray targeting the young flush — hexaconazole
    at each new leaf flush (about every 3-4 weeks during active flushing and wet
    weather) and copper hydroxide as a protective spray every 2-3 weeks during the
    wet, high-sporulation season. Spray in the early morning or late afternoon, avoid
    spraying just before rain, and keep to the stated intervals. Wear PPE — gloves,
    mask and long sleeves — when mixing and applying, and follow the product label.
  instructions_bm: Awasi daun menguning dengan bintik hijau pada pucuk muda dan gugur
    daun di tengah dahan meninggalkan ranting kosong. Pangkas dahan berjangkit 30 cm
    di bawah jalur pembuluh, kemudian sembur pucuk muda dengan hexaconazole setiap
    3-4 minggu berselang-seli dengan kuprum hidroksida untuk elak rintangan. Sembur
    pada awal pagi atau lewat petang, elak sebelum hujan, dan pakai sarung tangan,
    penutup mulut serta lengan panjang.
