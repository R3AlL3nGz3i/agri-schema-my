crop: durian
disease:
  name: patch_canker
  local_name: penyakit kanker batang (kanker tampal batang durian)
  pathogen:
    type: oomycete
    species: Phytophthora palmivora
  symptoms:
    visual:
    - Dark, water-soaked patches on the lower trunk bark that turn reddish-brown as
      they enlarge
    - Reddish-brown gum or resin exudate oozing from cracks in the affected bark (gummosis)
    - Necrotic reddish-brown inner bark and cambium revealed when the discoloured
      outer bark is scraped away
    growth: Durian's most economically damaging disease in Malaysia; girdling cankers
      cause progressive canopy dieback and tree death within 1-3 years, with heavy
      losses in premium clones such as Musang King (D197), reducing orchard productivity
      and tree lifespan.
  severity_stages:
  - stage: early
    signs: Small, dark, water-soaked patches near the trunk base with slight gummosis;
      bark still firm and lesions not yet spreading.
  - stage: moderate
    signs: Lesions enlarge and coalesce with active reddish-brown exudate; outer bark
      cracks and flakes, inner bark necrosis spreading; partial leaf yellowing in
      the canopy.
  - stage: severe
    signs: Canker girdles the trunk or main branches with extensive bark death; severe
      canopy dieback and defoliation, leading to tree collapse and death.
  treatments:
  - compound: Fosetyl-aluminium
    trade_name: Aliette 80 WP
    dosage: 2.5 g per litre water for foliar spray; for canker treatment, 10 g per
      100 ml water applied as a paste painted onto the scraped lesion
    method: foliar spray and bark paint after excising infected bark
    frequency: Every 2-3 weeks until the lesion dries, up to 3-4 applications
    pre_harvest_interval_days: null
    regulatory_status: MY_approved
    phi_not_applicable: true
    phi_not_applicable_reason: "Bark paint on the excised trunk lesion; fruit is not in contact, no residue on the harvested fruit."
  - compound: Metalaxyl-M (mefenoxam) + mancozeb
    trade_name: Ridomil Gold MZ 68 WG
    dosage: 2 g per litre water applied as a soil drench around the root zone, approximately
      5-10 litres of solution per mature tree
    method: soil drench
    frequency: 2-3 applications at 4-week intervals during wet periods
    pre_harvest_interval_days: null
    regulatory_status: MY_approved
    phi_not_applicable: true
    phi_not_applicable_reason: "Soil drench around the root zone; no residue on the harvested fruit."
  cultural_controls:
  - Improve orchard drainage and avoid waterlogging; plant on mounds or raised beds
    in low-lying areas to reduce Phytophthora build-up in the root zone
  - Avoid mechanical wounding of the trunk during weeding and grass-cutting, as wounds
    are infection entry points; keep the trunk base clear and dry
  - Excise and remove infected bark with a clean, sterilised knife, apply a fungicidal
    wound dressing, and collect and destroy infected plant debris
  - Apply Trichoderma-enriched compost or organic mulch around the root zone and maintain
    adequate tree spacing for good air circulation
  rotation_partner: Alternate the two listed fungicides, which have different modes
    of action, to manage resistance — rotate fosetyl-aluminium (a phosphonate) with
    the metalaxyl-M (mefenoxam) plus mancozeb product (a phenylamide combined with
    a multi-site protectant) rather than relying on a single chemistry against this
    Phytophthora canker.
  application: Use fosetyl-aluminium as a foliar spray and as a paste painted onto
    the scraped lesion after excising infected bark, repeated every 2-3 weeks until
    the lesion dries (up to 3-4 applications); use the metalaxyl-M + mancozeb product
    as a soil drench around the root zone, 2-3 times at 4-week intervals during wet
    periods. Spray or apply in the early morning or late afternoon, avoid application
    just before rain, keep to the stated intervals, and wear PPE — gloves, mask and
    long sleeves — when mixing and applying.
  instructions_bm: Awasi tompok basah gelap dan getah coklat kemerahan pada kulit pangkal
    batang. Kikis dan buang kulit berjangkit, sapu penebat luka fungisid, kemudian
    sembur atau siram racun kulat berselang-seli antara fosetyl-aluminium dan produk
    metalaxyl-M supaya elak rintangan. Kerjakan pada awal pagi atau lewat petang, elak
    sebelum hujan, dan pakai sarung tangan, penutup mulut serta lengan panjang.
  source_citations:
  - MARDI – Pakej Teknologi Penanaman Durian, Institut Penyelidikan dan Kemajuan Pertanian
    Malaysia (MARDI), Serdang
  - 'Lim, T.K. (1990). Durian: Diseases and Disorders. Tropical Press Sdn. Bhd., Kuala
    Lumpur'
