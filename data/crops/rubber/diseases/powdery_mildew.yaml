crop: rubber
disease:
  name: powdery_mildew
  local_name: embun tepung
  pathogen:
    type: fungi
    species: Oidium heveae
  symptoms:
    visual:
    - White, floury (powdery) fungal growth coating young, tender bronze/copper-coloured
      leaflets on both surfaces
    - Affected leaflets become distorted, crinkled and curled, with darkened (necrotic)
      margins
    - Premature shedding of young leaflets leaving bare petioles and raches — a "secondary
      leaf fall" after natural wintering
    growth: Principal cause of secondary leaf fall during refoliation (typically Jan–Mar
      in Peninsular Malaysia); severe outbreaks delay canopy recovery, depress latex
      flow and can reduce annual yield by an estimated 10–20% in epidemic years, and
      also lower seed set in seed gardens
  severity_stages:
  - stage: early
    signs: Isolated translucent flecks and small white powdery spots on the underside
      of young, tender bronze-stage leaflets; visible against transmitted light
  - stage: moderate
    signs: Extensive white floury coating on both leaf surfaces; leaflets distorted
      and curled; premature shedding of young leaflets leaving bare petioles
  - stage: severe
    signs: Heavy, repeated defoliation of the refoliating crown; trees forced through
      multiple refoliation cycles; sparse thin canopy, delayed crown recovery and
      reduced latex yield
  treatments:
  - compound: Sulphur (elemental, finely ground)
    dosage_grounding:
      verified: false
      note: AI-generated agronomic estimate, not the DOA-registered label dose (the
        authoritative source mypesticide.doa.gov.my is login-gated). Verify the rate
        on the product label before mixing or spraying.
      doa_residue_reference: 'Rubber is not a food commodity and has no residue record
        in the DOA portal (mymrl.doa.gov.my); this dose and PHI are not grounded in
        a public DOA source.'
    trade_name: null
    dosage: 11 kg fine sulphur dust (325 mesh, ~99% S) per hectare per round
    method: dusting (ground duster or aerial application)
    frequency: 6–8 rounds at 5–7 day intervals through refoliation, starting at the
      bronze/copper-leaf stage when ~10% of trees are refoliating
    pre_harvest_interval_days: null
    phi_grounding:
      verified: false
      status: not_applicable
      source: null
      note: Rubber is a non-food commodity - no residue/PHI concept applies.
    regulatory_status: MY_approved
  - compound: Wettable sulphur (sulphur 80% WG)
    dosage_grounding:
      verified: false
      note: AI-generated agronomic estimate, not the DOA-registered label dose (the
        authoritative source mypesticide.doa.gov.my is login-gated). Verify the rate
        on the product label before mixing or spraying.
      doa_residue_reference: 'Rubber is not a food commodity and has no residue record
        in the DOA portal (mymrl.doa.gov.my); this dose and PHI are not grounded in
        a public DOA source.'
    trade_name: Kumulus DF
    dosage: 3–5 g per litre water, high-volume foliar spray
    method: foliar spray
    frequency: weekly during the refoliation period (about 5–6 sprays)
    pre_harvest_interval_days: null
    phi_grounding:
      verified: false
      status: not_applicable
      source: null
      note: Rubber is a non-food commodity - no residue/PHI concept applies.
    regulatory_status: MY_approved
  cultural_controls:
  - Plant less-susceptible/tolerant RRIM clones and monitor refoliation closely so
    dusting starts at the susceptible bronze-leaf stage
  - Promote early, rapid and uniform refoliation through balanced nutrition and good
    field hygiene so young leaves harden before peak disease pressure
  rotation_partner: Both listed treatments are sulphur (elemental dust and wettable
    sulphur), so alternating between them does not change the mode of action and gives
    no resistance-management benefit. Instead rely on non-chemical rotation — plant
    less-susceptible/tolerant RRIM clones and time dusting to the susceptible bronze-leaf
    stage so young leaves harden quickly and disease pressure is reduced.
  application: Apply sulphur dust with a ground or aerial duster, or wettable sulphur
    as a high-volume foliar spray, starting at the bronze/copper-leaf stage when about
    10% of trees are refoliating. Treat in the early morning or late afternoon and avoid
    application just before rain so the sulphur is not washed off. Keep to the stated
    5-7 day dusting rounds (6-8 rounds) or weekly sulphur sprays through refoliation.
    Wear gloves, a mask and long sleeves when handling and applying sulphur. Confirm the
    actual dose on the registered product label before mixing or spraying.
  instructions_bm: Pantau pokok semasa daun muda peringkat gangsa/tembaga pada musim
    refoliasi (biasanya Jan-Mac); mula dus atau sembur sulfur apabila kira-kira 10% pokok
    mula bertunas semula, lakukan pada waktu pagi atau lewat petang dan elak sebelum hujan.
    Ulang setiap 5-7 hari (dus) atau setiap minggu (sembur). Pakai sarung tangan, penutup
    mulut dan lengan panjang. Sahkan dos sebenar pada label produk berdaftar sebelum
    mencampur atau menyembur.
