crop: rubber
disease:
  name: south_american_leaf_blight
  local_name: Hawar Daun Amerika Selatan
  pathogen:
    type: fungi
    species: Microcyclus ulei
  symptoms:
    visual:
    - Pale green to yellow lesions on young leaves that turn dark brown with olive-grey
      sporulation (conidia) on the underside
    - Infected young leaves curl, become necrotic and drop prematurely (abnormal leaf
      fall), leaving bare branches
    - Repeated defoliation weakens trees and causes dieback of young shoots
    growth: Currently ABSENT from Malaysia and classified as a quarantine pest (NPPO
      Malaysia / EPPO A1 list). If introduced, modelling studies estimate potential
      yield loss of 50-100% for susceptible clones — the main reason Southeast Asian
      rubber is grown without this pathogen. Awareness and exclusion are the primary
      management response.
  severity_stages:
  - stage: early
    signs: Small pale lesions on recently expanded leaves; subcutaneous stroma forming;
      faint yellowing of reifolia stage B/C leaves
  - stage: severe
    signs: Repeated complete defoliation, extensive shoot dieback, bark crack, and
      tree death in susceptible clones under prolonged wet conditions
  treatments:
  - compound: Mancozeb
    dosage_grounding:
      verified: false
      note: AI-generated agronomic estimate, not the DOA-registered label dose (the
        authoritative source mypesticide.doa.gov.my is login-gated). Verify the rate
        on the product label before mixing or spraying.
      doa_residue_reference: Rubber is not a food commodity and has no residue record
        in the DOA portal (mymrl.doa.gov.my); this dose and PHI are not grounded in
        a public DOA source.
    trade_name: Dithane M-45
    dosage: 2g per litre water as protective foliar spray
    method: foliar spray
    frequency: Weekly during wet flushing periods if outbreak is confirmed
    pre_harvest_interval_days: 14
    phi_grounding:
      verified: false
      status: not_applicable
      source: null
      note: Rubber is a non-food commodity - no residue/PHI concept applies.
    regulatory_status: MY_approved
  - compound: Triadimefon
    dosage_grounding:
      verified: false
      note: AI-generated agronomic estimate, not the DOA-registered label dose (the
        authoritative source mypesticide.doa.gov.my is login-gated). Verify the rate
        on the product label before mixing or spraying.
      doa_residue_reference: Rubber is not a food commodity and has no residue record
        in the DOA portal (mymrl.doa.gov.my); this dose and PHI are not grounded in
        a public DOA source.
    trade_name: Bayleton 25WP
    dosage: 0.5g per litre water
    method: foliar spray
    frequency: Every 10-14 days during active leaf flush
    pre_harvest_interval_days: 21
    phi_grounding:
      verified: false
