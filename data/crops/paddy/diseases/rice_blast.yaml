crop: paddy
disease:
  name: rice_blast
  local_name: penyakit blas padi
  pathogen:
    type: fungi
    species: Magnaporthe oryzae
  symptoms:
    visual:
    - diamond-shaped lesions with grey centre and brown border on leaves
    - white to grey lesions on leaf collar (collar rot)
    - infected panicles turn grey-white and fail to fill grain (neck rot)
    growth: stunted tillering; dead hearts in vegetative stage; yield loss 20-80%
      in severe cases
  severity_stages:
  - stage: early
    signs: small brown specks less than 2mm, water-soaked margins
  - stage: mid
    signs: diamond-shaped lesions 1-3cm, grey centre visible
  - stage: severe
    signs: coalescing lesions, more than 50% leaf area affected, neck rot present
  treatments:
  - compound: Tricyclazole
    trade_name: Beam 75WP
    dosage: 0.5g per litre water
    method: foliar spray
    frequency: twice weekly for 2 weeks at first sign of infection
    pre_harvest_interval_days: 30
    phi_source: 'DOA Malaysia residue registry (mymrl.doa.gov.my): 30-day TDMH
      (Tempoh Dilarang Mengutip Hasil / pre-harvest interval) for Tricyclazole
      on Beras Kilang (milled rice). Authoritative MY government source.'
    regulatory_status: MY_approved
  - compound: Isoprothiolane
    trade_name: Fuji-One 40EC
    dosage: 1.5ml per litre water
    method: foliar spray
    frequency: apply at tillering and panicle initiation
    pre_harvest_interval_days: 21
    regulatory_status: MY_approved
  - compound: Azoxystrobin
    trade_name: Amistar 25SC
    dosage: 1ml per litre water
    method: foliar spray
    frequency: preventive — apply before symptom onset
    pre_harvest_interval_days: 14
    regulatory_status: MY_approved
  rotation_partner: Alternate the listed fungicides across their different modes of action
    to manage resistance — for example rotate Tricyclazole (Beam 75WP, a melanin-biosynthesis
    inhibitor) with Azoxystrobin (Amistar 25SC, a strobilurin/QoI) rather than repeating
    the same product; Isoprothiolane (Fuji-One 40EC) can also be alternated in the programme.
  application: Apply at the first sign of infection (or preventively for Azoxystrobin,
    before symptom onset) as a foliar spray, following the stated frequency for each
    product, and observe the 14-30 day pre-harvest interval. Spray in the early morning
    or late afternoon, avoid spraying before rain, observe the stated spray interval,
    and wear PPE (gloves, mask, long sleeves) when mixing and applying.
  instructions_bm: Perhatikan lesi berbentuk wajik berwarna kelabu pada daun; sembur
    sebaik tanda pertama muncul dan silih gantikan racun (contohnya Tricyclazole dengan
    Azoxystrobin) untuk elak kerintangan. Sembur pada awal pagi atau lewat petang, elakkan
    sebelum hujan, patuhi tempoh pra-tuai 14-30 hari, dan pakai sarung tangan, penutup
    muka serta lengan panjang.
  cultural_controls:
  - Use certified disease-free seed and plant blast-resistant/tolerant varieties recommended
    by MARDI, rotating varieties to manage pathogen races
  - Avoid excessive nitrogen fertiliser and apply balanced, split N-P-K fertilisation,
    which reduces the lush growth that favours blast
  - Practise field sanitation by ploughing in stubble and destroying infected crop residue,
    and manage water to avoid prolonged leaf wetness
  source_citations:
  - MARDI Technical Bulletin No. 245 (2022) — Pengurusan Penyakit Blas Padi
  - Jabatan Pertanian Pekeliling Teknikal BIL.3/2021 — Kawalan Penyakit Utama Padi
  - FAO AGROVOC concept rice_blast (agrovoc.fao.org)
