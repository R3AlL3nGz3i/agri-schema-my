    role: International taxonomic and phytosanitary reference for the pathogen
    taxon: Pyricularia oryzae (syn. Magnaporthe oryzae); EPPO code PYRIOR
    url: https://gd.eppo.int/taxon/PYRIOR
  - name: MARDI (Malaysian Agricultural Research and Development Institute)
    role: Malaysian national R&D authority for paddy
    url: https://www.mardi.gov.my
  - name: Department of Agriculture Malaysia (DOA / Jabatan Pertanian)
    role: Malaysian plant protection and pesticide regulatory authority
    url: https://www.doa.gov.my
