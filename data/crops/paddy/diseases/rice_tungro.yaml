crop: paddy
disease:
  name: rice_tungro
  local_name: penyakit tungro padi
  pathogen:
    type: virus
    species: Rice tungro spherical virus
  symptoms:
    visual:
    - Yellow to orange-yellow discolouration of leaves beginning at the leaf tip and
      spreading toward the base
    - Marked stunting of plants with reduced tillering, often appearing in field patches
    - Mottling or interveinal chlorosis on younger leaves and delayed, irregular flowering
    growth: Economically significant in Malaysian granary areas (MADA, KADA, IADA);
      yield loss ranges from minor to total crop failure, with infection in the first
      30-45 days after transplanting causing the most severe losses (up to 100%)
  severity_stages:
  - stage: early
    signs: Scattered individual plants showing slight tip yellowing and mild stunting;
      green leafhopper vectors present in the canopy
  - stage: moderate
    signs: Distinct patches of yellow-orange, stunted plants visible across the field
      with reduced tiller number and delayed development
  - stage: severe
    signs: Widespread severe stunting and orange discolouration, few or no productive
      panicles, high proportion of unfilled grain, large-scale yield loss
  treatments:
  - compound: imidacloprid
    trade_name: Confidor 200SL
    dosage: 0.5 mL per litre water
    dosage_grounding:
      verified: false
      note: AI-generated agronomic estimate, not the DOA-registered label dose (the
        authoritative source mypesticide.doa.gov.my is login-gated). Verify the rate
        on the product label before mixing or spraying.
      doa_residue_reference: 'No Beras Kilang residue record for imidacloprid in mymrl.doa.gov.my;
        neither dose nor PHI is grounded in a public DOA source.'
    method: foliar spray (targets green leafhopper vector; no chemical cures the virus)
    frequency: At first detection of green leafhopper; repeat after 7-10 days if vector
      threshold is exceeded
    pre_harvest_interval_days: 14
    phi_grounding:
      verified: false
      status: unverified
      source: null
    phi_unverified: true
    regulatory_status: MY_approved
  - compound: buprofezin
    trade_name: Applaud 10WP
    dosage: 0.5-1.0 g per litre water
    dosage_grounding:
      verified: false
      note: AI-generated agronomic estimate, not the DOA-registered label dose (the
        authoritative source mypesticide.doa.gov.my is login-gated). Verify the rate
        on the product label before mixing or spraying.
      doa_residue_reference: 'Buprofezin registered on Beras Kilang in mymrl.doa.gov.my/AIs/18
        (products Applaud, Fezin SC); portal grounds the 14-day PHI and lists spray-rate
        figures without per-litre units, not a label dose.'
    method: foliar spray (insect growth regulator targeting leafhopper nymphs)
    frequency: Apply against early nymphal stages; repeat after 10-14 days if vector
      pressure persists
    pre_harvest_interval_days: 14
    phi_grounding:
      verified: true
      status: verified
      source: mymrl.doa.gov.my/AIs/18
    regulatory_status: MY_approved
  rotation_partner: Alternate imidacloprid (Confidor 200SL), a neonicotinoid, with buprofezin
    (Applaud 10WP), an insect growth regulator that acts on a different target, when
    treating the green leafhopper vector so the same chemistry is not used repeatedly
    and vector resistance is delayed. No chemical cures the virus, so combine vector
    control with resistant varieties and roguing.
  application: Spray against the green leafhopper vector only at first detection or when
    the vector threshold is exceeded, alternating the two products; repeat after 7-14
    days only if vector pressure persists, and observe the 14-day pre-harvest interval
    for imidacloprid. Spray in the early morning or late afternoon, avoid spraying before
    rain, and wear PPE (gloves, mask, long sleeves) when mixing and applying. Confirm the
    actual dose on the registered product label before mixing or spraying.
  instructions_bm: Tiada racun yang menyembuhkan virus; kawal vektor cengkerik hijau
    dengan menyembur imidacloprid dan buprofezin secara silih ganti sebaik dikesan,
    ulang selepas 7-14 hari jika perlu. Buang pokok yang dijangkiti, tanam varieti tahan,
    sembur pada awal pagi atau lewat petang, elakkan sebelum hujan, patuhi tempoh pra-tuai
    14 hari, dan pakai sarung tangan, penutup muka serta lengan panjang. Sahkan dos sebenar
    pada label produk berdaftar sebelum mencampur atau menyembur.
  cultural_controls:
  - Practise synchronised planting within a locality and observe a fallow/rest period
    to break the green leafhopper and virus cycle
  - Plant tungro-tolerant rice varieties recommended by MARDI and avoid staggered
    planting
  - Rogue and destroy infected plants, ratoons, volunteer rice and grassy weeds that
    act as virus or vector hosts
  - Adjust planting date to avoid peak green leafhopper populations
