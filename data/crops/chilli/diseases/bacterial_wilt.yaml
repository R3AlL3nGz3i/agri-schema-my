crop: chilli
disease:
  name: bacterial_wilt
  local_name: Penyakit layu bakteria (dikenali petani sebagai 'layu bakteria cili')
  pathogen:
    type: bacteria
    species: Ralstonia solanacearum
  symptoms:
    visual:
    - Rapid wilting of leaves during peak afternoon heat with apparent recovery overnight,
      progressing to permanent irreversible wilt while leaves stay green (no yellowing)
    - Brown discolouration of the vascular tissue (xylem ring) visible when the stem
      base is cut crosswise
    - Greyish-white bacterial ooze streaming from a freshly cut stem suspended in
      clear water (positive streaming test); stunting and adventitious roots on the
      lower stem
    growth: One of the most damaging constraints to chilli in lowland Peninsular Malaysia;
      causes 40-100% plant loss in infected fields, worst during the wet season and
      on land with a history of solanaceous cropping. No curative chemical control
      exists, so losses translate directly to abandoned beds.
  severity_stages:
  - stage: early
    signs: Mild transient wilting of the youngest leaves during midday heat; plants
      appear to recover by evening; no leaf yellowing and no obvious stem symptoms.
  - stage: moderate
    signs: Wilting no longer reverses overnight; one side or multiple branches affected;
      brown vascular streaking seen in the cut stem; positive bacterial ooze (streaming)
      test.
  - stage: severe
    signs: Complete permanent wilt and plant collapse within days; plant death; disease
      spreads to adjacent plants forming dead patches across the bed.
  treatments:
  - compound: Copper hydroxide
    dosage_grounding:
      verified: false
      note: AI-generated agronomic estimate, not the DOA-registered label dose (the
        authoritative source mypesticide.doa.gov.my is login-gated). Verify the rate
        on the product label before mixing or spraying.
      doa_residue_reference: 'No Cili (chilli) residue record for copper hydroxide
        in mymrl.doa.gov.my; applied as a soil drench, not to the harvested fruit,
        so no DOA dose or PHI applies.'
    trade_name: Kocide 3000
    dosage: 2 g per litre water, applied as ~200 ml of solution drenched at the base
      of each plant
    method: soil drench
    frequency: Every 7-10 days as a suppressive/protective measure during high-risk
      wet periods (suppressive only, not curative)
    pre_harvest_interval_days: null
    regulatory_status: MY_approved
    phi_not_applicable: true
    phi_not_applicable_reason: "Soil drench at the plant base; no residue on the harvested fruit."
  - compound: Dazomet
    dosage_grounding:
      verified: false
      note: AI-generated agronomic estimate, not the DOA-registered label dose (the
        authoritative source mypesticide.doa.gov.my is login-gated). Verify the rate
        on the product label before mixing or spraying.
      doa_residue_reference: 'No Cili (chilli) residue record for dazomet in mymrl.doa.gov.my;
        a pre-plant soil fumigant applied before the crop cycle, so no DOA dose or
        PHI applies.'
    trade_name: Basamid G
    dosage: 30-50 g per square metre incorporated into moist soil, then covered/tarped
      for 7-14 days with a 2-3 week aeration period before transplanting
    method: pre-plant soil fumigation (granules incorporated into soil)
    frequency: Once per cropping cycle, before transplanting only
    pre_harvest_interval_days: null
    regulatory_status: MY_approved
    phi_not_applicable: true
    phi_not_applicable_reason: "Pre-plant soil fumigation before the crop cycle; no residue on the harvested fruit."
  cultural_controls:
  - Plant on raised beds with good drainage; avoid waterlogging and avoid field sections
    with a history of bacterial wilt
  - Practise 2-3 year crop rotation with non-solanaceous crops (rice, maize, legumes);
    do not rotate with tomato, eggplant or potato
  - Use certified disease-free seed and healthy seedlings raised in sterilised media;
    rogue and destroy infected plants immediately and do not compost them
  - Graft chilli scions onto bacterial-wilt-tolerant rootstock; disinfect tools, hands
    and footwear between plants and apply ground limestone to raise soil pH
  - Carry out soil solarisation during the fallow period to reduce inoculum
  rotation_partner: No curative chemical control exists for bacterial wilt, and the
    two listed inputs (a copper hydroxide soil drench and a pre-plant dazomet soil
    fumigation) are suppressive/pre-plant measures, not a rotating spray programme.
    Manage resistance and disease pressure through rotation of practices instead —
    practise 2-3 year crop rotation with non-solanaceous crops (rice, maize, legumes),
    use tolerant rootstocks and certified clean seed, and rotate in soil solarisation
    during fallow.
  application: Use the listed inputs as directed — dazomet only as a pre-plant soil
    fumigation before transplanting, and copper hydroxide as a base soil drench every
    7-10 days as a suppressive measure during high-risk wet periods (neither cures
    an infected plant). When mixing and applying, wear PPE (gloves, mask, long sleeves),
    work in the early morning or late afternoon, avoid application just before rain,
    and follow the aeration and interval periods stated on the label.
  instructions_bm: Awasi pokok yang layu tiba-tiba pada waktu tengah hari tetapi pulih
    pada waktu malam, dan garis pembuluh coklat bila batang dipotong. Tiada rawatan
    kimia menyembuhkan — amalkan giliran tanaman bukan solanaceae 2-3 tahun, guna benih
    bersih, dan cabut serta musnahkan pokok berjangkit. Pakai sarung tangan, penutup
    mulut dan lengan panjang semasa merawat tanah, dan kerjakan pada awal pagi atau
    lewat petang.
