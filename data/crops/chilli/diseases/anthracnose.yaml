crop: chilli
disease:
  name: anthracnose
  local_name: antraknos cili (reput buah cili)
  pathogen:
    type: fungi
    species: Colletotrichum scovillei (syn. C. capsici)
  symptoms:
    visual:
    - Sunken, circular to elongated lesions on ripening and ripe fruits, often with
      concentric rings
    - Dark spore masses (acervuli with black setae) within lesions, sometimes pink/salmon-coloured
      when moist
    - Initial small water-soaked spots on fruit surface that enlarge and darken; twig
      dieback and leaf spotting in heavy infections
    growth: Most economically important disease of chilli in Malaysia; causes both
      field and postharvest fruit rot, with reported yield losses commonly 20-50%
      and up to 80% under prolonged wet-season conditions, severely reducing marketable
      yield
  severity_stages:
  - stage: early
    signs: Tiny water-soaked or pale spots on fruit surface; no visible spore masses
      yet
  - stage: moderate
    signs: Sunken lesions enlarging with concentric rings; visible dark acervuli and
      setae; lesions begin to coalesce on individual fruits
  - stage: severe
    signs: Large coalescing lesions causing whole-fruit rot and premature fruit drop;
      twig dieback, defoliation and significant cluster loss across the field
  treatments:
  - compound: mancozeb
    dosage_grounding:
      verified: false
      note: AI-generated agronomic estimate, not the DOA-registered label dose (the
        authoritative source mypesticide.doa.gov.my is login-gated). Verify the rate
        on the product label before mixing or spraying.
      doa_residue_reference: 'No Cili (chilli) residue record for mancozeb in mymrl.doa.gov.my;
        neither dose nor PHI is grounded in a public DOA source.'
    trade_name: Dithane M-45 (80% WP)
    dosage: 2.5g per litre water
    method: foliar spray
    frequency: every 7-10 days, more frequent during wet weather
    pre_harvest_interval_days: 7
    phi_grounding:
      verified: false
      status: unverified
      source: null
    phi_unverified: true
    regulatory_status: MY_approved
  - compound: chlorothalonil
    dosage_grounding:
      verified: false
      note: AI-generated agronomic estimate, not the DOA-registered label dose (the
        authoritative source mypesticide.doa.gov.my is login-gated). Verify the rate
        on the product label before mixing or spraying.
      doa_residue_reference: 'Chlorothalonil registered on Cili (chilli) in mymrl.doa.gov.my/AIs/28
        (product Etanil WP); portal grounds a 7-day PHI (matching this entry) but lists
        a spray-rate figure without per-litre units, not a label dose.'
    trade_name: Daconil 720 SC
    dosage: 2ml per litre water
    method: foliar spray
    frequency: every 7-10 days, alternated with a protectant fungicide to limit resistance
    pre_harvest_interval_days: 7
    phi_grounding:
      verified: true
      status: verified
      source: mymrl.doa.gov.my/AIs/28
    regulatory_status: MY_approved
  cultural_controls:
  - Use certified disease-free seeds and resistant/tolerant varieties where available;
    treat seeds with hot water (52°C for 30 minutes) before sowing
  - Practise field sanitation by removing and destroying infected fruits and crop
    debris; rotate with non-solanaceous crops
  - Use staking, adequate plant spacing and drip irrigation (avoid overhead watering)
    plus plastic mulch to reduce soil splash and canopy humidity
  rotation_partner: The two listed fungicides, mancozeb and chlorothalonil, are both
    multi-site protectants with a similar mode of action, so alternating between them
    alone gives limited resistance benefit; rotating them does still spread selection
    pressure across two chemistries as the entry's treatment note intends. For durable
    resistance management, lean on cultural rotation as well — plant resistant/tolerant
    varieties, rotate with non-solanaceous crops, and remove infected fruit and debris.
  application: Apply both fungicides as a foliar spray every 7-10 days, spraying more
    frequently during wet weather, and alternate the two protectants to spread selection
    pressure. Spray in the early morning or late afternoon, avoid spraying just before
    rain, keep to the 7-10 day interval, and observe the 7-day pre-harvest interval.
    Wear PPE — gloves, mask and long sleeves — when mixing and applying. Confirm the actual
    dose on the registered product label before mixing or spraying.
  instructions_bm: Awasi bintik lekuk berbentuk bulat pada buah cili yang mula masak,
    terutama pada cuaca lembap. Buang dan musnahkan buah dijangkiti, kemudian sembur
    racun kulat protektan setiap 7-10 hari dan berselang-seli antara dua racun untuk
    kurangkan rintangan. Jangan sembur dalam tempoh 7 hari sebelum menuai; sembur
    pada awal pagi atau lewat petang dan pakai sarung tangan, penutup mulut serta
    lengan panjang. Sahkan dos sebenar pada label produk berdaftar sebelum mencampur atau
    menyembur.
