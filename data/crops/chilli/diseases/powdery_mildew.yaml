crop: chilli
disease:
  name: powdery_mildew
  local_name: embun tepung
  pathogen:
    type: fungi
    species: Leveillula taurica
  symptoms:
    visual:
    - White powdery fungal growth concentrated on the underside (abaxial surface)
      of leaves, a distinguishing trait of Leveillula taurica versus other powdery
      mildews
    - Pale yellow to chlorotic blotches on the upper leaf surface directly above the
      powdery patches, later turning brown and necrotic
    - Upward curling of affected leaves followed by premature shedding of older, lower
      leaves first
    growth: Progressive defoliation from the lower canopy upward reduces photosynthetic
      area and exposes fruit to sunscald; yield losses of roughly 20-50% reported
      in severe dry-season outbreaks in major chilli areas such as Kelantan, Johor
      and Pahang
  severity_stages:
  - stage: early
    signs: Scattered faint chlorotic flecks on the upper surface of older leaves with
      sparse, barely visible white powdery patches on the corresponding underside
  - stage: moderate
    signs: Yellow blotches enlarge and coalesce, distinct white powdery sporulation
      visible on the lower leaf surface, leaf margins curl and a few lower leaves
      begin to drop
  - stage: severe
    signs: Extensive defoliation from the base upward leaving only young top leaves,
      fruit exposed to sunscald, plants stunted with reduced fruit set
  treatments:
  - compound: wettable sulphur (sulfur 80% WG)
    dosage_grounding:
      verified: false
      note: AI-generated agronomic estimate, not the DOA-registered label dose (the
        authoritative source mypesticide.doa.gov.my is login-gated). Verify the rate
        on the product label before mixing or spraying.
      doa_residue_reference: No Cili (chilli) residue record for sulphur in mymrl.doa.gov.my;
        this dose and PHI are not grounded in a public DOA source (the entry PHI cites
        a foreign US EPA/APVMA exemption).
    trade_name: Kumulus DF
    dosage: 2.5 g per litre water
    method: foliar spray
    frequency: every 7-10 days while disease pressure persists
    pre_harvest_interval_days: 0
    phi_source: 'US EPA / APVMA: elemental sulphur has a 0-day PHI (exempt, contact
      mineral). Foreign source, NOT a Malaysian DOA/LPRMP label.'
    phi_grounding:
      verified: false
      status: unverified
      source: APVMA/US EPA foreign label (not a Malaysian DOA source)
    phi_unverified: true
    regulatory_status: MY_approved
  - compound: hexaconazole (50 g/L SC)
    dosage_grounding:
      verified: false
      note: AI-generated agronomic estimate, not the DOA-registered label dose (the
        authoritative source mypesticide.doa.gov.my is login-gated). Verify the rate
        on the product label before mixing or spraying.
      doa_residue_reference: No Cili (chilli) residue record for hexaconazole in mymrl.doa.gov.my;
        neither dose nor PHI is grounded in a public DOA source.
    trade_name: Anvil 5SC
    dosage: 1 ml per litre water
    method: foliar spray
    frequency: every 10-14 days, alternated with non-triazole fungicides to limit
      resistance
    pre_harvest_interval_days: 14
    phi_grounding:
      verified: false
      status: unverified
      source: null
    phi_unverified: true
    regulatory_status: MY_approved
  cultural_controls:
  - Use wider plant spacing and prune dense lower foliage to improve air circulation
    and lower canopy humidity
  - Remove and destroy infected leaves and crop debris, avoid overhead irrigation,
    and apply balanced fertiliser without excess nitrogen
  rotation_partner: Alternate the two listed fungicides, which have different modes
    of action, to manage resistance — rotate wettable sulphur (a multi-site protectant)
    with hexaconazole (a systemic triazole) rather than relying on the triazole alone.
    The entry's own note that hexaconazole should be alternated with non-triazole
    fungicides is met by pairing it with the sulphur already listed.
  application: Apply as a foliar spray, using wettable sulphur every 7-10 days while
    disease pressure persists and rotating in hexaconazole every 10-14 days. Spray
    in the early morning or late afternoon, avoid spraying just before rain, and keep
    to the stated intervals; observe the 14-day pre-harvest interval for hexaconazole.
    Wear PPE — gloves, mask and long sleeves — when mixing and applying. Confirm the
    actual dose on the registered product label before mixing or spraying.
  instructions_bm: Awasi tompok tepung putih pada permukaan bawah daun dan bercak
    kuning di atas daun, terutama pada musim kemarau. Sembur belerang boleh basah
    setiap 7-10 hari dan berselang-seli dengan hexaconazole untuk elak rintangan;
    jangan sembur hexaconazole dalam 14 hari sebelum menuai. Sembur pada awal pagi
    atau lewat petang, elak sebelum hujan, dan pakai sarung tangan, penutup mulut
    serta lengan panjang. Sahkan dos sebenar pada label produk berdaftar sebelum mencampur
    atau menyembur.
