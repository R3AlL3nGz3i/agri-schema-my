name: Validate Schema

on:
  push:
    paths:
      - 'data/crops/**/*.yaml'
  pull_request:
    paths:
      - 'data/crops/**/*.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run schema validator
        run: python pipeline/validator.py
